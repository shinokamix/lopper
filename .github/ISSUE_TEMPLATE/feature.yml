name: Feature request
description: Suggest an idea or a new rule for lopper
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you'd like lopper to behave. For new verdict rules, say which facts should lead to which verdict.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other designs you considered.

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement this?
      options:
        - "No"
        - "Yes, with some guidance"
        - "Yes"
