name: Set up Moon
description: Install the tools pinned in .prototools, with proto's shims on PATH, and restore the toolchain and Go caches. Moon's step saves the toolchain on main by itself. A job that saves the Go caches does it with the cache outputs after its tasks ran, on main and only when cache-hit is false.
inputs:
  cache:
    description: Restore the toolchain and Go caches
    default: 'true'
outputs:
  cache-path:
    description: The Go module, build and lint caches
    value: ${{ steps.go-cache.outputs.path }}
  cache-key:
    description: The Go cache key, which changes with the Go dependencies and toolchains
    value: ${{ steps.go-cache.outputs.key }}
  cache-hit:
    description: Whether the Go caches were restored from exactly cache-key
    value: ${{ steps.go-restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      with:
        auto-install: true
        auto-setup: true
        cache: ${{ inputs.cache }}
        cache-base: main
    - id: go-cache
      if: inputs.cache == 'true'
      shell: bash
      run: |
        prefix="go-$RUNNER_OS-$RUNNER_ARCH-"
        {
          echo "prefix=$prefix"
          echo "key=$prefix$DEPS"
          echo 'path<<EOF'
          echo '~/go/pkg/mod'
          echo '~/.cache/go-build'
          echo '~/Library/Caches/go-build'
          echo '~/AppData/Local/go-build'
          echo '~/.cache/golangci-lint'
          echo EOF
        } >>"$GITHUB_OUTPUT"
      env:
        DEPS: ${{ hashFiles('apps/lopper/go.sum', 'apps/lopper/tools/go.sum', '.prototools') }}
    - id: go-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.cache == 'true'
      with:
        path: ${{ steps.go-cache.outputs.path }}
        key: ${{ steps.go-cache.outputs.key }}
        restore-keys: ${{ steps.go-cache.outputs.prefix }}
