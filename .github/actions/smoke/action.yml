name: Smoke-test an archive
description: Check the archive for this runner's OS and architecture against checksums.txt, unpack it, and run the binary on a repo with one worktree.
inputs:
  artifact:
    description: The artifact with the archives and checksums.txt
    required: true
  version:
    description: The version the binary must report, empty for a snapshot
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/dist
    - working-directory: ${{ runner.temp }}/dist
      shell: bash
      run: |
        case $RUNNER_OS in
        Linux) os=linux ;;
        macOS) os=darwin ;;
        Windows) os=windows ;;
        esac
        case $RUNNER_ARCH in
        X64) arch=amd64 ;;
        ARM64) arch=arm64 ;;
        esac
        archive=lopper_${os}_$arch.tar.gz lopper=bin/lopper
        [ "$os" != windows ] || archive=lopper_${os}_$arch.zip lopper=bin/lopper.exe
        sha256sum=sha256sum
        [ "$os" != darwin ] || sha256sum="shasum -a 256"
        grep " $archive\$" checksums.txt | $sha256sum -c

        mkdir bin
        case $archive in
        *.zip) unzip -q "$archive" -d bin ;;
        *) tar -xzf "$archive" -C bin ;;
        esac

        version=$("$lopper" --version)
        echo "$version"
        case $version in
        *"${GITHUB_SHA:0:7}"*) ;;
        *) echo "::error::$archive is not built from ${GITHUB_SHA:0:7}" && exit 1 ;;
        esac
        if [ -n "$VERSION" ]; then
          case $version in
          *" ${VERSION#v} "*) ;;
          *) echo "::error::$archive is not version ${VERSION#v}" && exit 1 ;;
          esac
        fi

        git init -q repo
        git -C repo -c user.name=smoke -c user.email=smoke@localhost commit -q --allow-empty -m init
        git -C repo worktree add -q ../worktree
        want=$PWD/worktree
        [ "$os" != windows ] || want=$(cygpath -w "$want")
        found=$("$lopper" scan . --paths)
        [ "$found" = "$want" ] ||
          { echo "::error::scan found \"$found\" instead of $want" && exit 1; }
      env:
        VERSION: ${{ inputs.version }}
