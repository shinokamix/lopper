version: 2
updates:
  - package-ecosystem: gomod
    directories: [/, /tools]
    schedule:
      interval: weekly
    # Skip releases younger than a week: most compromised versions are yanked by then.
    cooldown:
      default-days: 7
    # "build(deps): …" — PR titles must be Conventional Commits (pr-title.yml).
    commit-message:
      prefix: build
      include: scope
    groups:
      gomod:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
