version: 2
updates:
  - package-ecosystem: gomod
    directories: [/apps/lopper, /apps/lopper/tools]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      gomod:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup-ci, /.github/actions/smoke]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        patterns: ["*"]
