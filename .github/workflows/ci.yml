name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `moon ci` diffs against main, so checkouts fetch the full history without file
# contents.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: $/.github/actions/setup-ci
      - id: pnpm
        # The assignment fails the step when pnpm is missing, and echo would not.
        run: |
          store=$("$(moon bin pnpm)" store path --silent)
          echo "store=$store" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - run: moon ci --summary minimal
      - uses: moonrepo/run-report-action@bbe7e99bf2aca819ec660ec01fc59d84bdd492d6 # v1.10.0
        if: (success() || failure()) && hashFiles('.moon/cache/ciReport.json') != ''
        with:
          access-token: ${{ github.token }}
          skip-comment: true

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: $/.github/actions/setup-ci
      - run: moon ci --summary minimal :test
      - uses: moonrepo/run-report-action@bbe7e99bf2aca819ec660ec01fc59d84bdd492d6 # v1.10.0
        if: (success() || failure()) && hashFiles('.moon/cache/ciReport.json') != ''
        with:
          access-token: ${{ github.token }}
          skip-comment: true
          matrix: ${{ toJSON(matrix) }}

  # A job of its own, and outside moon ci, because tasks running alongside
  # would skew the times. The checkout is the merge commit, so HEAD^1 is the
  # base branch. macOS and Windows runners are too noisy for a time limit.
  # GitHub's macOS image puts Homebrew's git first in PATH, and most Macs run
  # Apple's /usr/bin/git instead.
  bench:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, max-slowdown: "20" }
          - { name: macOS, os: macos-latest, max-slowdown: "off" }
          - { name: macOS with Apple's git, os: macos-latest, max-slowdown: "off", apple-git: true }
          - { name: Windows, os: windows-latest, max-slowdown: "off" }
    name: bench (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/lopper/tools/go.mod
          cache-dependency-path: |
            apps/lopper/go.sum
            apps/lopper/tools/go.sum
      - if: matrix.apple-git
        run: echo /usr/bin >>"$GITHUB_PATH"
      - run: sh .github/scripts/bench.sh HEAD^1
        env:
          BENCH_OUT: ${{ runner.temp }}/bench
          BENCH_NAME: ${{ matrix.name }}
          BENCH_MAX_SLOWDOWN: ${{ matrix.max-slowdown }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: bench-${{ strategy.job-index }}
          path: ${{ runner.temp }}/bench
          if-no-files-found: ignore

  # The token of a pull request from a fork cannot comment. Each run edits the
  # comment of the run before.
  bench-report:
    needs: bench
    if: (success() || failure()) && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*
          path: ${{ runner.temp }}/bench
      - run: |
          set -- "$RUNNER_TEMP"/bench/bench-*/report.md
          [ -f "$1" ] || exit 0
          for report; do cat "$report"; echo; done >"$RUNNER_TEMP/report.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file "$RUNNER_TEMP/report.md"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}

  release-snapshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the version from tags
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/lopper/tools/go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --config apps/lopper/.goreleaser.yaml --snapshot --clean

  install:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install.sh
        if: runner.os != 'Windows'
        run: sh .github/scripts/test-install.sh
      - name: install.ps1 in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: .github/scripts/test-install.ps1
      - name: install.ps1 in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/test-install.ps1
