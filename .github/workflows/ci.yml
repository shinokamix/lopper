name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# pwsh on Windows splits `-modfile=tools/go.mod` at the dot; use bash everywhere.
defaults:
  run:
    shell: bash

# Jobs call the same Task entry points as `task check` locally.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # tools/go.mod needs the newer Go; go.mod only states the minimum.
          go-version-file: tools/go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go tool -modfile=tools/go.mod task tidy:check
      - run: go tool -modfile=tools/go.mod task lint # all GOOS

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go tool -modfile=tools/go.mod task test

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go tool -modfile=tools/go.mod task vuln

  release-snapshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the version from tags
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          # The job builds release artifacts: don't restore a cache PRs could have written.
          cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --snapshot --clean

  # The install scripts, run against the latest release.
  install:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          export LOPPER_INSTALL_DIR="$RUNNER_TEMP/bin"
          LOPPER_VERSION=0.1.0-rc.1 sh install.sh # a release pinned without its v
          "$RUNNER_TEMP/bin/lopper" --version | grep -F ' 0.1.0-rc.1 '

          # The latest replaces it, and a lopper earlier in PATH is warned about.
          mkdir "$RUNNER_TEMP/other"
          printf '#!/bin/sh\n' >"$RUNNER_TEMP/other/lopper"
          chmod +x "$RUNNER_TEMP/other/lopper"
          PATH="$RUNNER_TEMP/other:$PATH" sh install.sh | tee "$RUNNER_TEMP/out"
          grep -F "$RUNNER_TEMP/other/lopper comes first in your PATH" "$RUNNER_TEMP/out"
          version=$("$RUNNER_TEMP/bin/lopper" --version)
          case "$version" in *rc.1*) echo "the latest release did not replace $version"; exit 1 ;; esac
          test "$(ls -A "$RUNNER_TEMP/bin")" = lopper # no staging file left
      - name: install.ps1 in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: .github/scripts/test-install.ps1
      - name: install.ps1 in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/test-install.ps1
