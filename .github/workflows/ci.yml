name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# `moon ci` diffs against main, so checkouts fetch the full history without file
# contents. On main, Moon diffs against HEAD~1 unless given a base, which would
# leave out all but the last commit of a push.
env:
  MOON_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: setup
        uses: $/.github/actions/setup-ci
      - run: moon ci --summary minimal
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && steps.setup.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cache-path }}
          key: ${{ steps.setup.outputs.cache-key }}
      - uses: moonrepo/run-report-action@bbe7e99bf2aca819ec660ec01fc59d84bdd492d6 # v1.10.0
        if: (success() || failure()) && hashFiles('.moon/cache/ciReport.json') != ''
        with:
          access-token: ${{ github.token }}
          skip-comment: true

  # GitHub's macOS image puts Homebrew's git first in PATH, ahead of Apple's
  # /usr/bin/git.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: macOS with Apple's git, os: macos-latest, apple-git: true }
          - { name: Windows, os: windows-latest }
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: setup
        uses: $/.github/actions/setup-ci
      - if: matrix.apple-git
        run: echo /usr/bin >>"$GITHUB_PATH"
      - run: moon ci --summary minimal lopper:test
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && steps.setup.outputs.cache-hit != 'true' && !matrix.apple-git
        with:
          path: ${{ steps.setup.outputs.cache-path }}
          key: ${{ steps.setup.outputs.cache-key }}
      - uses: moonrepo/run-report-action@bbe7e99bf2aca819ec660ec01fc59d84bdd492d6 # v1.10.0
        if: (success() || failure()) && hashFiles('.moon/cache/ciReport.json') != ''
        with:
          access-token: ${{ github.token }}
          skip-comment: true
          matrix: ${{ toJSON(matrix) }}

  # The checkout is the merge commit, so HEAD^1 is the base branch. macOS and
  # Windows runners are too noisy for a time limit.
  bench:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, rounds: "10", max-slowdown: "20" }
          - { name: macOS, os: macos-latest, rounds: "3", max-slowdown: "0" }
          - { name: macOS with Apple's git, os: macos-latest, rounds: "3", max-slowdown: "0", apple-git: true }
          - { name: Windows, os: windows-latest, rounds: "3", max-slowdown: "0" }
    name: bench (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: $/.github/actions/setup-ci
      - if: matrix.apple-git
        run: echo /usr/bin >>"$GITHUB_PATH"
      - working-directory: apps/lopper
        run: |
          mkdir "$RUNNER_TEMP/bench"
          go run ./cmd/bench -name "$NAME" -rounds "$ROUNDS" -max-slowdown "$MAX_SLOWDOWN" HEAD^1 >"$RUNNER_TEMP/bench/report.md"
        env:
          NAME: ${{ matrix.name }}
          ROUNDS: ${{ matrix.rounds }}
          MAX_SLOWDOWN: ${{ matrix.max-slowdown }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: bench-${{ strategy.job-index }}
          path: ${{ runner.temp }}/bench
          if-no-files-found: ignore

  # The token of a pull request from a fork cannot comment.
  bench-report:
    needs: bench
    if: (success() || failure()) && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*
          path: ${{ runner.temp }}/bench
      - run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/bench/bench-*/report.md)
          [ ${#reports[@]} -gt 0 ] || exit 0
          cat "${reports[@]}" >"$RUNNER_TEMP/report.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file "$RUNNER_TEMP/report.md"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}

  release-snapshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the version from tags
          persist-credentials: false
      - uses: $/.github/actions/setup-ci
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --config apps/lopper/.goreleaser.yaml --snapshot --clean
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  smoke:
    needs: release-snapshot
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: $/.github/actions/smoke
        with:
          artifact: snapshot

  install:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install.sh
        if: runner.os != 'Windows'
        run: sh .github/scripts/test-install.sh
      - name: install.ps1 in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: .github/scripts/test-install.ps1
      - name: install.ps1 in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/test-install.ps1

  # A skipped job counts as passed, so this is the one check a branch needs.
  ci-ok:
    needs: [check, test, bench, release-snapshot, smoke, install]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$FAILED" = false
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
