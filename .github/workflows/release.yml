name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the GitHub release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the version and notes from tags
          persist-credentials: false
      - uses: $/.github/actions/setup-ci
        with:
          # Release artifacts must not come from a cache PRs could have written.
          cache: false
      # A tag on a commit CI never passed would still be released: check again.
      - run: moon check --all
      # goreleaser runs go itself, outside Moon.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/lopper/tools/go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --config apps/lopper/.goreleaser.yaml --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Lets anyone check an archive came from this workflow:
      # gh attestation verify lopper_darwin_arm64.tar.gz -R shinokamix/lopper
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      # go install resolves versions of the nested module only from tags with
      # its directory as prefix. Without one, it builds a pseudo-version that
      # lopper update does not treat as a release.
      - name: Tag the Go module
        run: |
          module_tag="apps/lopper/$GITHUB_REF_NAME"
          sha=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          # A rerun or a manual fix may have created the tag already.
          if git rev-parse -q --verify "refs/tags/$module_tag" >/dev/null; then
            test "$(git rev-parse "$module_tag^{commit}")" = "$sha"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$module_tag" -f "sha=$sha"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
