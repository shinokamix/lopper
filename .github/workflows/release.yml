name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

# pwsh on Windows splits `-modfile=tools/go.mod` at the dot; use bash everywhere.
defaults:
  run:
    shell: bash

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the GitHub release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the version and notes from tags
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          # Release artifacts must not come from a cache PRs could have written.
          cache: false
      # A tag on a commit CI never passed would still be released: check again.
      - run: go tool -modfile=tools/go.mod task check
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Lets anyone check an archive came from this workflow:
      # gh attestation verify lopper_darwin_arm64.tar.gz -R shinokamix/lopper
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
