name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the version and notes from tags
          persist-credentials: false
      # GitHub runs this on any tag, even on a commit CI never passed.
      - name: Require a green ci run on main
        run: |
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main" && exit 1; }
          runs=$(gh run list --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          [ "$runs" -gt 0 ] ||
            { echo "::error::ci has not passed on main for $GITHUB_SHA yet; rerun this job once it has" && exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: $/.github/actions/setup-ci
        with:
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --config apps/lopper/.goreleaser.yaml --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  smoke:
    needs: build
    uses: $/.github/workflows/smoke.yml
    with:
      artifact: release
      version: ${{ github.ref_name }}

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      # go install resolves versions of the nested module only from tags with
      # its directory as prefix.
      - name: Tag the Go module
        run: |
          module_tag="apps/lopper/$GITHUB_REF_NAME"
          sha=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          if git rev-parse -q --verify "refs/tags/$module_tag" >/dev/null; then
            test "$(git rev-parse "$module_tag^{commit}")" = "$sha"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$module_tag" -f "sha=$sha"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - run: |
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" |
            LOPPER_VERSION="$GITHUB_REF_NAME" LOPPER_INSTALL_DIR="$RUNNER_TEMP/bin" sh
          version=$("$RUNNER_TEMP/bin/lopper" --version)
          case $version in
          *" ${GITHUB_REF_NAME#v} "*) ;;
          *) echo "::error::install.sh installed $version" && exit 1 ;;
          esac
          gh release download "$GITHUB_REF_NAME" --pattern lopper_linux_amd64.tar.gz --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/lopper_linux_amd64.tar.gz" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/apps/lopper/$GITHUB_REF_NAME" --silent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
