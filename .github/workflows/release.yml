name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the version and notes from tags
          persist-credentials: false
      # GitHub runs this on any tag, even on a commit CI never passed.
      - name: Wait for ci on main to pass
        run: |
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main" && exit 1; }
          for _ in $(seq 30); do
            run=$(gh run list --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq ".[].databaseId")
            [ -z "$run" ] || break
            sleep 10
          done
          [ -n "$run" ] || { echo "::error::ci never ran on main for $GITHUB_SHA" && exit 1; }
          gh run watch "$run" --exit-status --interval 30 >/dev/null ||
            { echo "::error::ci run $run on main did not pass" && exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: $/.github/actions/setup-ci
        with:
          cache: false
      - run: moon run lopper:vuln
      # Without it, the notes of a release after its candidates list only what
      # changed since the last candidate.
      - id: notes
        run: |
          case $GITHUB_REF_NAME in
          *-*) ;;
          *)
            previous=$(git describe --tags --abbrev=0 --exclude 'apps/*' --exclude '*-*' HEAD^)
            echo "previous=$previous" >>"$GITHUB_OUTPUT"
            ;;
          esac
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --config apps/lopper/.goreleaser.yaml --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.notes.outputs.previous }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: $/.github/actions/smoke
        with:
          artifact: release
          version: ${{ github.ref_name }}

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      # go install resolves versions of the nested module only from tags with
      # its directory as prefix.
      - name: Tag the Go module
        run: |
          module_tag="apps/lopper/$GITHUB_REF_NAME"
          sha=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          if git rev-parse -q --verify "refs/tags/$module_tag" >/dev/null; then
            test "$(git rev-parse "$module_tag^{commit}")" = "$sha"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$module_tag" -f "sha=$sha"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/tested
      - name: The published assets are the tested ones
        working-directory: ${{ runner.temp }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir published
          cmp tested/checksums.txt published/checksums.txt
          (cd published && sha256sum -c checksums.txt)
          for archive in published/*.tar.gz published/*.zip; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$GITHUB_REF_NAME" --source-digest "$GITHUB_SHA"
          done
          module=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/apps/lopper/$GITHUB_REF_NAME" --jq .object.sha)
          [ "$module" = "$GITHUB_SHA" ] ||
            { echo "::error::apps/lopper/$GITHUB_REF_NAME points at $module, not $GITHUB_SHA" && exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: install.sh installs the release
        run: |
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" |
            LOPPER_VERSION="$GITHUB_REF_NAME" LOPPER_INSTALL_DIR="$RUNNER_TEMP/bin" sh
          version=$("$RUNNER_TEMP/bin/lopper" --version)
          case $version in
          *" ${GITHUB_REF_NAME#v} "*) ;;
          *) echo "::error::install.sh installed $version" && exit 1 ;;
          esac
