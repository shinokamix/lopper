name: security
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # New or updated dependencies: known vulnerabilities and licenses.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # GitHub reports golang.org/x modules with the Go patent grant beside BSD-3-Clause.
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0,
            LicenseRef-scancode-google-patent-license-golang
          # Dev tools from apps/lopper/tools/go.mod. They never reach the lopper binary.
          allow-dependencies-licenses: >-
            pkg:golang/github.com/golangci/golangci-lint/v2,
            pkg:golang/github.com/OpenPeeDeeP/depguard/v2,
            pkg:golang/github.com/alecthomas/chroma/v2,
            pkg:golang/github.com/alecthomas/go-check-sumtype,
            pkg:golang/github.com/alfatraining/structtag,
            pkg:golang/github.com/denis-tingaikin/go-header,
            pkg:golang/github.com/fatih/structtag,
            pkg:golang/github.com/firefart/nonamedreturns,
            pkg:golang/github.com/ldez/structtags,
            pkg:golang/github.com/leonklingele/grouper,
            pkg:golang/github.com/xen0n/gosmopolitan

  # Static analysis of the workflows themselves (injection, excessive permissions…).
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
