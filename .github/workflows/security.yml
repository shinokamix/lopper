name: security
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # New or updated dependencies: known vulnerabilities and licenses.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0
          # These exact versions were already present before the Go project moved
          # under apps/lopper. Dependency review sees the move as a new dependency
          # and rechecks their licenses. Keep the exception version-specific so a
          # future upgrade still goes through the license policy.
          allow-dependencies-licenses: >-
            pkg:golang/github.com/golangci/golangci-lint/v2,
            pkg:golang/github.com/OpenPeeDeeP/depguard/v2@2.2.1,
            pkg:golang/github.com/alecthomas/chroma/v2@2.27.0,
            pkg:golang/github.com/alecthomas/go-check-sumtype@0.5.1-0.20260828200218-ae6904d28606,
            pkg:golang/github.com/alfatraining/structtag@1.0.0,
            pkg:golang/github.com/denis-tingaikin/go-header@0.5.0,
            pkg:golang/github.com/fatih/structtag@1.2.0,
            pkg:golang/github.com/firefart/nonamedreturns@1.0.8,
            pkg:golang/github.com/ldez/structtags@0.6.1,
            pkg:golang/github.com/leonklingele/grouper@1.1.2,
            pkg:golang/github.com/xen0n/gosmopolitan@1.3.0,
            pkg:golang/golang.org/x/sync@0.23.0,
            pkg:golang/golang.org/x/sys@0.47.0,
            pkg:golang/golang.org/x/sys@0.48.0,
            pkg:golang/golang.org/x/term@0.46.0,
            pkg:golang/golang.org/x/tools@0.49.0,
            pkg:golang/golang.org/x/tools@0.50.0

  # Static analysis of the workflows themselves (injection, excessive permissions…).
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
