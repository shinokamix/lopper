version: "2"

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gofumpt:
      extra:
        group-params: true
    gci:
      sections:
        - standard
        - default
        - localmodule

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - contextcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - gochecksumtype # exhaustive type switches over //sumtype:decl interfaces
    - gocritic
    - gosec
    - misspell
    - modernize
    - nilerr
    - nolintlint
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    exhaustive:
      # A `default:` branch counts as handling the remaining cases.
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks:
        # Worktree and Facts are small value types passed by value on purpose.
        - hugeParam
        - rangeValCopy
        - unnamedResult
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # Running git with computed arguments is the whole point of gitx.
      - path: internal/gitx/
        linters: [gosec]
        text: G204
      - path: _test\.go
        linters: [gosec, forcetypeassert]
