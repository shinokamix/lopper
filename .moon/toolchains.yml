$schema: ./cache/schemas/toolchains.json

# Read by moonrepo/setup-toolchain to install proto in CI.
proto:
  version: '0.62.3'

# Moon installs this Go through proto and runs every task with it. Keep it in
# step with apps/lopper/tools/go.mod, which setup-go reads for GoReleaser.
go:
  version: '1.27.2'

# Node and pnpm build apps/site. Moon installs both through proto, like Go.
# Keep them in step with apps/site/package.json. Its engines field names the
# Node major, and pnpm switches to its packageManager on its own.
javascript:
  packageManager: pnpm

node:
  version: '24.21.0'

pnpm:
  version: '12.9.1'
