version: 2
project_name: lopper
builds:
  - dir: apps/lopper
    main: ./cmd/lopper
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags: -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}
archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./install.sh
    - glob: ./install.ps1
release:
  prerelease: auto
  extra_files:
    - glob: ./install.sh
    - glob: ./install.ps1
changelog:
  sort: asc
  filters:
    exclude:
      - '^(build|chore|ci|docs|refactor|style|test)(\(.+\))?:'
  groups:
    - title: Breaking changes
      regexp: '^\w+(\(.+\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 1
    - title: Bug fixes
      regexp: '^fix(\(.+\))?:'
      order: 2
    - title: Performance
      regexp: '^perf(\(.+\))?:'
      order: 3
    - title: Other changes
      order: 999
