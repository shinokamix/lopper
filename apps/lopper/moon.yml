$schema: ../../.moon/cache/schemas/project.json

language: go
layer: application

fileGroups:
  sources:
    - cmd/**/*
    - internal/**/*
    - go.mod
    - go.sum
  # Changing any of these can change what a check reports.
  tooling:
    - tools/go.mod
    - tools/go.sum
    - .golangci.yml
    - /.prototools
    - /.moon/toolchains.yml
    - /.moon/workspace.yml
    - moon.yml
    - /.github/workflows/ci.yml
    - /.github/actions/**/*

# Go caches builds and test results itself; Moon only picks what to run.
taskOptions:
  cache: false
  windowsShell: bash

tasks:
  build:
    description: Build lopper into bin/
    command: go build -o bin/ ./cmd/lopper
    inputs:
      - '@group(sources)'
    outputs:
      - bin/*

  # The pre-commit hook passes only the staged Go files (affectedFiles); run
  # directly, it checks the whole module. In CI, `lint` checks formatting.
  format:
    description: Fail if Go files need formatting (gofumpt, gci)
    command: go tool -modfile tools/go.mod golangci-lint fmt --diff
    inputs:
      - cmd/**/*.go
      - internal/**/*.go
    options:
      affectedFiles: args
      runInCI: false

  fix:
    description: Tidy both go.mod files, format and apply automatic lint fixes
    script: go mod tidy && (cd tools && go mod tidy) && go tool -modfile tools/go.mod golangci-lint run --fix
    preset: utility

  lint:
    description: Lint and check formatting for every target OS
    deps:
      - ~:lint-darwin
      - ~:lint-linux
      - ~:lint-windows
    inputs: &checked
      - '@group(sources)'
      - '@group(tooling)'

  # `go tool` would build golangci-lint itself for $GOOS, so resolve the
  # host binary first and set GOOS only for the lint run.
  lint-darwin:
    script: GOOS=darwin "$(go tool -n -modfile tools/go.mod golangci-lint)" run --allow-parallel-runners
    inputs: *checked
    options:
      internal: true

  lint-linux:
    script: GOOS=linux "$(go tool -n -modfile tools/go.mod golangci-lint)" run --allow-parallel-runners
    inputs: *checked
    options:
      internal: true

  lint-windows:
    script: GOOS=windows "$(go tool -n -modfile tools/go.mod golangci-lint)" run --allow-parallel-runners
    inputs: *checked
    options:
      internal: true

  test:
    description: Run all tests with the race detector
    command: go tool -modfile tools/go.mod gotestsum --format pkgname-and-test-fails -- -race ./...
    inputs: *checked

  coverage:
    description: Run tests and open the coverage report
    # One command: a script line that fails does not stop the next.
    script: go tool -modfile tools/go.mod gotestsum --format pkgname-and-test-fails -- -coverprofile=coverage.out ./... && go tool cover -html=coverage.out
    preset: utility

  fuzz:
    description: Fuzz the git worktree list parser (30s; pass -fuzztime after -- to change)
    command: go test ./internal/gitx -run '^$' -fuzz FuzzParseWorktreeList -fuzztime 30s
    preset: utility

  tidy-check:
    description: Fail if either go.mod needs tidying
    script: go mod tidy -diff && cd tools && go mod tidy -diff
    inputs: *checked

  vuln:
    description: Check dependencies for known vulnerabilities
    command: go tool -modfile tools/go.mod govulncheck ./...
    inputs: *checked
    options:
      # New advisories appear without any change here.
      runInCI: always

  fixture:
    description: Create a sandbox with sample worktrees in .tmp/fixture
    script: |
      set -e
      rm -rf .tmp/fixture && mkdir -p .tmp/fixture && cd .tmp/fixture
      git init -q -b main repo
      git -C repo commit -q --allow-empty -m init
      git -C repo worktree add -q -b merged ../wt-merged
      git -C repo worktree add -q -b wip .claude/worktrees/wip
      git -C repo/.claude/worktrees/wip commit -q --allow-empty -m wip
      touch repo/.claude/worktrees/wip/dirty.txt
      git -C repo worktree add -q -b unpushed ../wt-unpushed
      git -C wt-unpushed commit -q --allow-empty -m work
      echo 'Fixture ready. From apps/lopper, run: go run ./cmd/lopper .tmp/fixture'
    env:
      # Keep a global core.hooksPath from running hooks on the fixture commits.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_VALUE_0: /dev/null
    preset: utility

  demo:
    description: Record the README animation into docs/demo.gif (needs ttyd and ffmpeg)
    command: go run github.com/charmbracelet/vhs@v0.12.1 docs/demo.tape
    preset: utility
