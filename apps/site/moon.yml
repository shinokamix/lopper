$schema: ../../.moon/cache/schemas/project.json

language: typescript
layer: application

fileGroups:
  sources:
    - src/**/*
    - public/**/*
    - astro.config.ts
    - tsconfig.json
    - /apps/lopper/docs/demo.mp4
  # Changing any of these can change what a check reports.
  tooling:
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - .prettierrc.json
    - .prettierignore
    - moon.yml
    - /.prototools
    - /.moon/toolchains.yml
    - /.moon/workspace.yml
    - /.github/workflows/ci.yml
    - /.github/actions/**/*

env:
  ASTRO_TELEMETRY_DISABLED: '1'

tasks:
  dev:
    description: Serve the site with live reload on localhost:4321
    command: astro dev
    preset: server

  build:
    description: Build the static site into dist/
    command: astro build
    inputs:
      - '@group(sources)'
      - '@group(tooling)'
      # astro.config.ts builds the canonical and og:image links from this domain.
      - $VERCEL_PROJECT_PRODUCTION_URL
    outputs:
      - dist

  typecheck:
    description: Type-check the pages and scripts
    command: astro check
    inputs:
      - '@group(sources)'
      - '@group(tooling)'

  # The pre-commit hook runs it, so only the files that Prettier checks or that
  # configure it make it affected.
  format:
    description: Fail if files need formatting
    command: prettier --check .
    inputs:
      - src/**/*
      - astro.config.ts
      - package.json
      - tsconfig.json
      - pnpm-lock.yaml
      - .prettierrc.json
      - .prettierignore

  fix:
    description: Format all files
    command: prettier --write .
    preset: utility
