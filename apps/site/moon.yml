$schema: ../../.moon/cache/schemas/project.json

language: typescript
layer: application

fileGroups:
  sources:
    - src/**/*
    - public/**/*
    - astro.config.ts
    - tsconfig.json
    - /packages/demo/**/*
  tooling:
    - package.json
    - eslint.config.js
    - /package.json
    - /pnpm-lock.yaml
    - /pnpm-workspace.yaml
    - .prettierrc.json
    - .prettierignore
    - moon.yml
    - /.prototools
    - /.moon/toolchains.yml
    - /.moon/workspace.yml
    - /.github/workflows/ci.yml
    - /.github/actions/**/*

env:
  ASTRO_TELEMETRY_DISABLED: '1'

tasks:
  dev:
    description: Serve the site with live reload on localhost:4321
    command: astro dev
    preset: server

  build:
    description: Build the static site into dist/
    command: astro build
    inputs:
      - '@group(sources)'
      - '@group(tooling)'
      - $VERCEL_PROJECT_PRODUCTION_URL
      - $VERCEL_ENV
    outputs:
      - dist

  typecheck:
    description: Type-check the pages and scripts
    command: astro check
    inputs: &checked
      - '@group(sources)'
      - '@group(tooling)'

  lint:
    description: Fail if a file imports another project by path
    command: eslint .
    inputs: *checked

  format:
    description: Fail if files need formatting
    command: prettier --check .
    inputs:
      - src/**/*
      - astro.config.ts
      - eslint.config.js
      - vercel.json
      - package.json
      - tsconfig.json
      - /pnpm-lock.yaml
      - .prettierrc.json
      - .prettierignore

  fix:
    description: Format all files
    command: prettier --write .
    preset: utility
