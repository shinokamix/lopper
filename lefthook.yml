# Git hooks. Install with `task setup`.
pre-commit:
  # Sequential: fmt rewrites (and re-stages) files that lint then reads.
  piped: true
  jobs:
    - name: fmt
      glob: "*.go"
      run: go tool -modfile=tools/go.mod golangci-lint fmt {staged_files}
      stage_fixed: true
    # Lints only the packages containing staged files (working-tree contents,
    # host GOOS). The full cross-OS lint runs in pre-push and CI (`task check`).
    - name: lint
      glob: "*.go"
      run: go tool -modfile=tools/go.mod golangci-lint run $(for f in {staged_files}; do echo "./$(dirname "$f")"; done | sort -u)
    - name: tidy
      glob: "{go.mod,go.sum,tools/go.mod,tools/go.sum}"
      run: go tool -modfile=tools/go.mod task tidy:check

commit-msg:
  jobs:
    - name: conventional-commit
      run: |
        head -n1 {1} | grep -qE '^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: .+|Merge .+|(fixup|squash)! .+)' || {
          echo "Commit message must follow Conventional Commits, e.g. 'feat(tui): detail pane shows worktree size'"
          exit 1
        }

pre-push:
  jobs:
    - name: check
      run: go tool -modfile=tools/go.mod task check
